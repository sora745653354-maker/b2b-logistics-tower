name: Deploy sanitized dashboard demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "pages-demo/**"
      - ".github/workflows/deploy-pages-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only the sanitized demo folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-demo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
